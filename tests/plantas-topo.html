<!doctype html><meta charset="utf-8">
<!-- Vista de cima de cada planta 3D, para comparar com a planta oficial (tests/plantas-topo.js) -->
<script type="importmap">{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }</script>
<body style="margin:0;background:#fff">
<script type="module">
import * as THREE from 'three';
import { buildPlanGroup, PLANS } from '../js/plan3d.js';
const id = new URLSearchParams(location.search).get('p');
const b = buildPlanGroup(PLANS[id]); const [W, D] = b.size;
const H = 900, Wpx = Math.round(H * W / D);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(Wpx, H); document.body.appendChild(r.domElement);
r.shadowMap.enabled = true;
const sc = new THREE.Scene(); sc.background = new THREE.Color(0xffffff); sc.add(b.group);
sc.add(new THREE.HemisphereLight(0xffffff, 0xcccccc, 2.2)); const l = new THREE.DirectionalLight(0xffffff, 1.6); l.position.set(-3, 10, 4); sc.add(l);
const cam = new THREE.OrthographicCamera(-W / 2 - 0.2, W / 2 + 0.2, D / 2 + 0.2, -D / 2 - 0.2, 0.1, 50); cam.position.set(0, 20, 0); cam.up.set(0, 0, -1); cam.lookAt(0, 0, 0);
r.render(sc, cam); window.__ok = true;
</script>
